<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Community-indexed vending prices for Ragnarok Online Zero - search shops, cards and random options, and find the vendor on the map." />
    <!--
      What this page is allowed to talk to, declared rather than assumed.

      The site is static and renders no HTML it did not write, so this is not
      patching a hole - it is a blast radius. If a dependency is ever
      compromised, the interesting move is to exfiltrate somewhere, and
      connect-src is the list of somewheres.

      Each entry earns its place:
        img-src     midgardhub.com serves the item icons; self serves the
                    minimaps and the two shop board icons out of the GRF.
        connect-src the Supabase project, substituted at build time so this
                    follows the environment instead of pinning a project id.
        style-src   unsafe-inline is required: React writes inline style
                    attributes, and a style attribute is inline style.
      frame-ancestors is deliberately absent - a meta CSP cannot enforce it,
      and writing it here would only look like protection.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: https://midgardhub.com;
               connect-src 'self' %VITE_SUPABASE_URL%;
               font-src 'self';
               base-uri 'none';
               form-action 'none';
               object-src 'none'"
    />
    <title>ROZ Market</title>

    <!--
      What this link looks like when somebody pastes it.

      The index spreads by being shared - into a Discord channel, a Facebook
      group, a guild chat - and every one of those unfurls a link by reading
      these tags. Without them the same URL arrives as a bare grey string, and
      a bare grey string asking players to trust a price index is a hard sell.

      The URLs are absolute because a crawler has no page to resolve them
      against, and og.png is drawn rather than screenshotted: a real capture of
      the index carries shop titles and character names, which is exactly what
      the README screenshots go to the trouble of pseudonymising.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ROZ Market" />
    <meta property="og:title" content="ROZ Market - community vending prices for Ragnarok Online Zero" />
    <meta property="og:description" content="Search what players are selling by item, socketed card or random option, see what a shop had when someone last looked, and find the vendor on the map." />
    <meta property="og:url" content="https://samuel23.github.io/roz_market/" />
    <meta property="og:image" content="https://samuel23.github.io/roz_market/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Three market listings - a Triple Critical Stiletto, a Hurricane Composite Bow and a Hood - with prices and random options." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ROZ Market - community vending prices for Ragnarok Online Zero" />
    <meta name="twitter:description" content="Search what players are selling by item, socketed card or random option, and find the vendor on the map." />
    <meta name="twitter:image" content="https://samuel23.github.io/roz_market/og.png" />
    <meta name="theme-color" content="#0f1117" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
